name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        # TODO: remove once the existing lint errors in src/ are fixed
        # (unused vars, react-hooks compiler rules, empty catch blocks).
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
